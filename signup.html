<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | hunter-net.org</title>
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="auth-page">
    <div id="loader"></div>
    <div id="content">
      <main class="auth-shell">
        <section class="auth-panel">
          <p class="warning-text"><strong>Request Authorization </strong></p>
          <form id="signup-form" class="auth-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" title="Use 3-24 letters, numbers, or underscores." required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
            <button id="signup-button" type="submit">Submit</button>
          </form>
          <p id="signup-message" class="auth-message" role="status" aria-live="polite"></p>
          <p class="auth-links"><a href="pages/index.html">Return to sign in</a></p>
        </section>
      </main>

      <div id="footer">WARNING: DO NOT ENTER YOUR REAL NAME OR OTHER PERSONAL IDENTIFICATION. THE CONFIDENTIALITY OF INFORMATION ON THIS SITE CANNOT BE GUARANTEED.</div>
      <img src="assets/images/darkpack_logo2.png" alt="copyright" class="darkpack-logo">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/signup.js"></script>
  </body>
</html>
