<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | hunter-net.org</title>
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
    <div id="loader"></div>
    <div id="content">
      <div class="container">
        <div class="box box1">
          <div class="row">
            <div class="column"><img src="assets/images/left1.png" alt="Left" class="header-side-img"></div>
            <div class="column"><img src="assets/images/titlealt2.png" alt="Hunter-Net" class="header-title-img"></div>
            <div class="column"><img src="assets/images/right1.png" alt="Right" class="header-side-img"></div>
          </div>
        </div>

        <nav class="topnav" aria-label="Main navigation">
          <a href="index.html">Enter session</a>
          <a href="pages/main.html">Home</a>
          <div class="dropdown"><button class="dropbtn" type="button">Archives</button><div class="dropdown-content"><a href="pages/monsters.html">The Quarry</a></div></div>
          <div class="dropdown"><button class="dropbtn" type="button">Resources</button><div class="dropdown-content"><a href="pages/sheet.html">Character Sheet</a><a href="pages/quickplay.html">Quick-Play Rules</a></div></div>
          <a href="pages/contact.html">Contact</a>
          <a href="pages/credits.html">Credits</a>
          <img src="assets/images/darkpack_logo2.png" alt="copyright" class="darkpack-logo">
        </nav>

        <main class="signup-form">
          <table class="signup-table">
            <tr><td class="signup-table-cell">
              <div class="text-left">
                <blockquote class="dashed-panel">
                  <h1 class="signup-heading">Sign Up</h1>
                  <form id="signup-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <button id="signup-button" type="submit">Sign Up</button>
                  </form>
                  <p id="signup-message" role="status" aria-live="polite" class="signup-message"></p>
                </blockquote>
              </div>
            </td></tr>
          </table>
        </main>

        <img src="assets/images/unity.png" alt="Bottom" class="unity-standard">
      </div>
    </div>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/signup.js"></script>
  </body>
</html>
